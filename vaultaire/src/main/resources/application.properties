spring.application.name=vaultaire

# PostgreSQL - Use environment variables on Render
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/vaultaire}
spring.datasource.username=${POSTGRES_USER:admin}
spring.datasource.password=${POSTGRES_PASSWORD:admin}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File upload limits
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# MinIO - Use environment variables on Render
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minio}
minio.secret-key=${MINIO_SECRET_KEY:minio123}
minio.bucket=${MINIO_BUCKET:vaultaire}

# Server port
server.port=8080