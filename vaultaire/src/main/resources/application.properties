spring.application.name=vaultaire

# PostgreSQL - Use environment variables on Render
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://postgres:5432/vaultaire}
spring.datasource.username=${POSTGRES_USER:admin}
spring.datasource.password=${POSTGRES_PASSWORD:admin}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File upload limits
spring.servlet.multipart.max-file-size=40MB
spring.servlet.multipart.max-request-size=40MB

# MinIO - Use environment variables on Render
minio.url=${MINIO_URL:http://minio:9000}
minio.access-key=${MINIO_ACCESS_KEY:minio}
minio.secret-key=${MINIO_SECRET_KEY:minio123}
minio.bucket=${MINIO_BUCKET:vaultaire}

# Server port
server.port=8080


# Connection timeout for database (helps on Render free tier)
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000