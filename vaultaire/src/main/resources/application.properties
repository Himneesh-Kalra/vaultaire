spring.application.name=vaultaire

# PostgreSQL - Use localhost since in same container
spring.datasource.url=jdbc:postgresql://localhost:5432/vaultaire
spring.datasource.username=admin
spring.datasource.password=admin123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File upload limits
spring.servlet.multipart.max-file-size=40MB
spring.servlet.multipart.max-request-size=40MB

# MinIO - Use localhost since in same container
minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minio123
minio.bucket=vaultaire

# Server port
server.port=8080

# Connection timeout
spring.datasource.hikari.connection-timeout=60000